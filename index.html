<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3730a3" />
    <meta name="description" content="Daywell — a calmer everyday. Your planner, money, reminders, shopping, documents, and habits, privately on your device." />
    <title>Daywell — a calmer everyday</title>
    <script>
      try {
        const p = JSON.parse(localStorage.getItem('daywell.preferences') || '{}');
        const dark = p.theme === 'dark' || (p.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
